# GitHub Actions：规则集 MRS 构建（每天一次，三源各取所需）
# 三个上游源 → 统一转 mrs / 保留 yaml → 产物 commit 到本仓库 rule/mrs/。
#   1) blackmatrix7 release : 国区细分 + 全球/私网/广告
#   2) MetaCubeX/meta-rules-dat meta 分支 : cn/geolocation-!cn 官方 mrs（直接下载）
#   3) Loyalsoldier/clash-rules release : reject/apple/tld-not-cn yaml → mrs
# 服务器只需 curl 本仓库 raw 的成品，不需要 mihomo 二进制。
# 仓库：EndDream/myproxy（公开），产物路径 rule/mrs/，不影响 rule/ 下的自定义规则。
name: Build rule sets (MRS)

on:
  schedule:
    # 每天 UTC 18:30 = 北京时间次日 02:30（错开各源更新高峰）
    - cron: '30 18 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write   # 需要提交产物

concurrency:
  group: build-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mihomo (v1.19.34 linux amd64)
        run: |
          curl -fsSL -o mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz
          gzip -df mihomo.gz
          chmod +x mihomo
          ./mihomo -v | head -1

      - name: Fetch blackmatrix7 sources (release branch)
        run: |
          mkdir -p src rule/mrs
          BASE=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Clash
          set -e
          curl -fsSL --retry 3 -o src/Global.yaml                    $BASE/Global/Global.yaml
          curl -fsSL --retry 3 -o src/Global_Domain.txt              $BASE/Global/Global_Domain.txt
          curl -fsSL --retry 3 -o src/ChinaMax_Domain.txt            $BASE/ChinaMax/ChinaMax_Domain.txt
          curl -fsSL --retry 3 -o src/ChinaMax_IP.txt                $BASE/ChinaMax/ChinaMax_IP.txt
          curl -fsSL --retry 3 -o src/AdvertisingLite.yaml           $BASE/AdvertisingLite/AdvertisingLite.yaml
          curl -fsSL --retry 3 -o src/AdvertisingLite_Domain.txt     $BASE/AdvertisingLite/AdvertisingLite_Domain.txt
          curl -fsSL --retry 3 -o src/Lan.yaml                       $BASE/Lan/Lan.yaml
          wc -c src/*

      - name: Fetch meta + Loyalsoldier sources
        run: |
          set -e
          META=https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo
          curl -fsSL --retry 3 -o rule/mrs/Meta_CN_Domain.mrs      $META/geosite/cn.mrs
          curl -fsSL --retry 3 -o rule/mrs/Meta_CN_IP.mrs          $META/geoip/cn.mrs
          curl -fsSL --retry 3 -o rule/mrs/Meta_Global_Domain.mrs  'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-%21cn.mrs'
          LO=https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release
          curl -fsSL --retry 3 -o src/Reject.txt     $LO/reject.txt
          curl -fsSL --retry 3 -o src/Apple.txt      $LO/apple.txt
          curl -fsSL --retry 3 -o src/TldNotCN.txt   $LO/tld-not-cn.txt
          wc -c src/Reject.txt src/Apple.txt src/TldNotCN.txt

      - name: Convert sources -> mrs
        run: |
          set -e
          # bm7 domain/ipcidr -> mrs
          ./mihomo convert-ruleset domain  text src/Global_Domain.txt           rule/mrs/Global_Domain.mrs
          ./mihomo convert-ruleset domain  text src/ChinaMax_Domain.txt         rule/mrs/ChinaMax_Domain.mrs
          ./mihomo convert-ruleset ipcidr  text src/ChinaMax_IP.txt             rule/mrs/ChinaMax_IP.mrs
          ./mihomo convert-ruleset domain  text src/AdvertisingLite_Domain.txt  rule/mrs/AdvertisingLite_Domain.mrs
          # bm7 3 个 classical 原样保留
          cp src/Global.yaml          rule/mrs/Global.yaml
          cp src/AdvertisingLite.yaml rule/mrs/AdvertisingLite.yaml
          cp src/Lan.yaml             rule/mrs/Lan.yaml
          # Loyalsoldier yaml(payload) -> mrs
          ./mihomo convert-ruleset domain yaml src/Reject.txt     rule/mrs/LoyalReject.mrs
          ./mihomo convert-ruleset domain yaml src/Apple.txt      rule/mrs/Apple.mrs
          ./mihomo convert-ruleset domain yaml src/TldNotCN.txt   rule/mrs/TldNotCN.mrs

      - name: Verify artifacts (magic + size + mihomo decode)
        run: |
          set -e
          # 1) 所有 mrs 魔数必须是 zstd: 28 b5 2f fd
          for f in rule/mrs/*.mrs; do
            magic=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            [ "$magic" = "28b52ffd" ] || { echo "BAD MAGIC $f: $magic"; exit 1; }
            sz=$(stat -c %s "$f")
            [ "$sz" -gt 100 ] || { echo "TOO SMALL $f: $sz"; exit 1; }
            echo "OK $f ($sz bytes, zstd)"
          done
          # 2) mihomo 反解验证（防坏文件/空文件）
          for spec in \
            "domain Global_Domain.mrs" \
            "domain ChinaMax_Domain.mrs" \
            "ipcidr ChinaMax_IP.mrs" \
            "domain AdvertisingLite_Domain.mrs" \
            "domain LoyalReject.mrs" \
            "domain Apple.mrs" \
            "domain TldNotCN.mrs" \
            "domain Meta_CN_Domain.mrs" \
            "ipcidr Meta_CN_IP.mrs" \
            "domain Meta_Global_Domain.mrs"; do
            set -- $spec
            behavior=$1; f=$2
            out="/tmp/${f%.mrs}.verify.txt"
            ./mihomo convert-ruleset "$behavior" mrs "rule/mrs/$f" "$out" >/dev/null 2>&1 || { echo "DECODE FAIL $f"; exit 1; }
            lines=$(wc -l < "$out")
            case "$f" in
              Apple.mrs) min=100 ;;
              TldNotCN.mrs) min=500 ;;
              *) min=1000 ;;
            esac
            [ "$lines" -gt "$min" ] || { echo "TOO FEW LINES $f: $lines (min $min)"; exit 1; }
            echo "  decode $f: $lines lines"
          done
          ls -la rule/mrs/

      - name: Commit artifacts
        run: |
          git config user.name  "rules-bot"
          git config user.email "rules-bot@users.noreply.github.com"
          git add rule/mrs/
          if git diff --cached --quiet; then
            echo "No rule changes, skip commit."
          else
            echo "Rule changes detected:"
            git diff --cached --stat
            git commit -m "chore: update rule sets $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
